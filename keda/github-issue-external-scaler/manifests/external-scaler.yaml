apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-issue-external-scaler
  namespace: keda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-issue-external-scaler
  template:
    metadata:
      labels:
        app: github-issue-external-scaler
    spec:
      containers:
        - name: scaler
          image: ghcr.io/willeastbury/github-issue-external-scaler:latest
          ports:
            - containerPort: 8080
              name: webhook
            - containerPort: 9090
              name: grpc
          env:
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-webhook-secret
                  key: secret
            - name: GITHUB_FILTER_REPO
              value: owner/repo
            - name: GRPC_ADDR
              value: ":9090"
            - name: HTTP_ADDR
              value: ":8080"
            - name: KEDA_METRIC_NAME
              value: github_issue_events_pending
            - name: KEDA_TARGET_VALUE
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: github-issue-external-scaler
  namespace: keda
spec:
  selector:
    app: github-issue-external-scaler
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: webhook
      port: 8080
      targetPort: webhook
